# Keeps the scheduled workflows running. In a public repository GitHub turns
# schedules off after 60 days without activity, silently, and that would stop
# the backups and the token warnings. This re-enables them through the API
# every week, without a commit, and warns by email well before the deadline
# in case the API call ever stops counting. See MAINTENANCE.md
name: Keepalive

on:
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive:
    name: Scheduled workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # enabling an enabled workflow is reported to restart its inactivity
      # clock. GitHub doesn't document that, hence the commit check below.
      # This one has to keep itself alive too
      - name: Re-enable the schedules
        run: |
          for workflow in backup.yml token-expiry.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow/enable"
            echo "$workflow: $(gh api "repos/$REPO/actions/workflows/$workflow" --jq .state)"
          done

      # GitHub only emails about failed runs, and a backup that stopped
      # running fails nothing
      - name: Check the last backup
        run: |
          last=$(gh api "repos/$REPO/actions/workflows/backup.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$last" ]; then
            echo "::error::The Backup workflow has never succeeded"
            exit 1
          fi
          days=$(( ($(date -u +%s) - $(date -ud "$last" +%s)) / 86400 ))
          if [ "$days" -gt 8 ]; then
            echo "::error::The last successful backup was $days days ago ($last)"
            exit 1
          fi
          echo "Last successful backup: $last, $days days ago"

      # GitHub doesn't document what counts as activity, only that commits
      # do. From day 50 this fails weekly, so there are two emails before 60
      - name: Check the last commit
        run: |
          last=$(gh api "repos/$REPO/commits/${{ github.event.repository.default_branch }}" \
            --jq .commit.committer.date)
          days=$(( ($(date -u +%s) - $(date -ud "$last" +%s)) / 86400 ))
          if [ "$days" -ge 50 ]; then
            echo "::error::No commit on main for $days days. Merge a Dependabot pull request or push any commit before day 60, see MAINTENANCE.md"
            exit 1
          fi
          echo "Last commit on main: $last, $days days ago"
